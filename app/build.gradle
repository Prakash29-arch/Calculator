plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.android.calculator2'
    compileSdk = 37

    defaultConfig {
        // Different from the AOSP id so it installs alongside / on top of stock devices
        // without clashing with a system "com.android.calculator2".
        applicationId = 'com.android.calculator2.purple'
        minSdk = 26          // adaptive launcher icon lives in mipmap-anydpi
        targetSdk = 37
        versionCode = 1
        versionName = '17.0-purple'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation project(':crcalc')

    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.customview:customview:1.1.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
