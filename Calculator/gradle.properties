org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
# This AOSP code uses `switch (...) { case R.id.xxx: }` everywhere, which needs R ids to be
# compile-time constants.  AGP 8.x honours this opt-out; AGP 9.x ignores it.
android.nonFinalResIds=false
# compileSdk 37 is newer than the AGP 8.11 "tested up to" level; it works, just silence the warning.
android.suppressUnsupportedCompileSdk=37
